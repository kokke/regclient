version: 1
creds:
  - registry: registry:5000
    tls: disabled
  - registry: docker.io
    user: "{{env \"HUB_USER\"}}"
    pass: "{{file \"/home/appuser/.docker/hub_token\"}}"
defaults:
  ratelimit:
    min: 100
    retry: 15m
  parallel: 2
  interval: 60m
  backup: "bkup-{{.Ref.Tag}}"
  minAge: 72h
  # minAgeSource controls how image age is measured. Options:
  #   created   (default) - use the Created timestamp embedded in the image config.
  #                         Simple, but can be spoofed by the image builder.
  #   firstSeen           - use the time regsync first observed the image digest.
  #                         Immune to spoofed timestamps; requires a sidecar JSON file.
  # minAgeSource: firstSeen
  #
  # firstSeenFile is the path to the sidecar JSON file used by minAgeSource: firstSeen.
  # When minAgeSource is firstSeen and this is not set, a default path is derived
  # from the config filename (e.g. regsync.yml -> regsync-first-seen.json).
  # Can be overridden per sync entry to use separate files per registry.
  # firstSeenFile: /var/lib/regsync/first-seen.json
sync:
  - source: busybox:latest
    target: registry:5000/library/busybox:latest
    type: image
  - source: alpine
    target: registry:5000/library/alpine
    type: repository
    tags:
      allow:
      - "latest"
      - "3"
      - "3.\\d+"
  - source: debian
    target: registry:5000/library/debian
    type: repository
    tags:
      allow:
      - "\\d+"
    mediaTypes:
      - "application/vnd.docker.distribution.manifest.v1+json"
      - "application/vnd.docker.distribution.manifest.v1+prettyjws"
      - "application/vnd.docker.distribution.manifest.v2+json"
      - "application/vnd.docker.distribution.manifest.list.v2+json"
      - "application/vnd.oci.image.manifest.v1+json"
      - "application/vnd.oci.image.index.v1+json"
  - source: ghcr.io/regclient/regctl:latest
    target: registry:5000/regclient/regctl:latest
    type: image
